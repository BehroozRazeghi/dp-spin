# Synthetic user-level configuration used by scripts/run_demo.sh.

# Inputs and output directory.
experiment_name: demo_user
records: data/processed/demo_records.jsonl
atoms: data/public_atoms/demo_atoms.json
output_dir: outputs/demo/user/runs

# All records with the same user_id form one protected contribution.
protected_unit: user
user_id_field: user_id
adjacency: adddrop
n_users: 160
user_selection: hash
user_contribution_bound: 5.0  # l1 clipping bound B after per-user aggregation.

# Public denominator used to convert released noisy masses to normalized semantic-support values.
public_denominator: 160
auto_public_denominator_from_n_users: true

# Record-level assignment before per-user aggregation, and released plan size.
m: 15
K: 3
gamma: 10.0  # Softmax concentration; larger values favor higher-similarity atoms.
L: 5

# Differentially private semantic-plan release.
epsilon: 1.0
delta: 1.0e-6
mechanism: gaussian
gaussian_calibration: analytic
seed: 0

# The template decoder verbalizes only the released semantic plan.
decoder_backend: template

# Support-bin thresholds, expressed as fractions of public_denominator.
support_bins:
  very high: 0.20
  high: 0.10
  moderate: 0.05
  low: 0.0
