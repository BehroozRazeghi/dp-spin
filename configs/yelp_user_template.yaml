# Base configuration for Yelp Restaurant user-level grids.
# scripts/run_yelp.sh supplies the grid values and may override paths and output directories.

# Protected target data, public atom dictionary, auxiliary TF-IDF fit data, and output.
experiment_name: yelp_user
records: data/protected_target/yelp_target_records.jsonl
atoms: data/public_atoms/yelp_atoms_m200.json
embedding_fit_records: data/auxiliary/yelp_atom_auxiliary_records.jsonl
output_dir: outputs/yelp/user/runs

# All reviews with the same user_id form one protected contribution.
protected_unit: user
user_id_field: user_id
adjacency: adddrop
n_users: 1000
user_selection: hash
user_contribution_bound: 2.0  # l1 clipping bound B after per-user aggregation.

# Public denominator used to compute released prevalence values and bins.
public_denominator: 1000
auto_public_denominator_from_n_users: true

# Record-level assignment before per-user aggregation, and released plan size.
# The main grid uses separately constructed 50- and 100-atom dictionaries.
m: 200
K: 3
gamma: 10.0  # Softmax concentration; larger values favor higher-similarity atoms.
L: 10

# Differentially private semantic-plan release.
epsilon: 1.0
delta: 1.0e-6
mechanism: gaussian
gaussian_calibration: analytic
seed: 0

# Released-plan verbalization and offline non-private reference evaluation.
decoder_backend: template
clean_reference_decoder_backend: template
summary_embedding_backend: tfidf
summary_comparative_eval_backend: none

# Descriptive provenance metadata saved with the run; this field is not an enforcement check.
atom_source_protocol: >-
  atoms and TF-IDF fit built from user-disjoint public/auxiliary split;
  protected users are target split

# Prevalence-bin thresholds, expressed as fractions of public_denominator.
prevalence_bins:
  very common: 0.20
  common: 0.10
  moderate: 0.05
  low: 0.0
